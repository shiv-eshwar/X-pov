[project]
name = "xprov-mas"
version = "0.1.0"
description = "Experiment-first provenance benchmark for cross-domain multi-agent LLM evidence systems"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "sentence-transformers>=3.3,<6",
  "networkx>=3.2,<4",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "tqdm>=4.66,<5",
  "statsmodels>=0.14,<1",
  "pyarrow>=15,<22",
  "datasets>=3,<5"
]

[tool.uv]
dev-dependencies = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
